<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ToolHive</title>
    <style>
      /* Instant first paint: no white flash while JS loads */
      html, body { margin: 0; background: #f9fafb; }
      @media (prefers-color-scheme: dark) { html, body { background: #030712; } }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #boot i { width: 36px; height: 36px; border: 4px solid #2563eb33; border-top-color: #2563eb; border-radius: 50%; animation: s .8s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"><div id="boot"><i></i></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
